plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.a1broad.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.a1broad.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install 'requests>=2.32.3,<3'
            install 'websockets>=12.0,<16'
            install 'protobuf>=5.29.3,<7'
            install 'python-dotenv>=1.0.1,<2'
        }
    }
}
